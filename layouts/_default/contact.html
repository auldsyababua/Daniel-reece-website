{{ define "main" }}
<section class="contact">
    <div class="bg-gray-200 dark:bg-gray-900">
        <div class="max-w-screen-xl mx-auto px-4 pt-[50px] pb-[60px] text-center">
            <h1 class="text-3xl md:text-4xl xl:text-5xl font-semibold tracking-tight text-gray-800 dark:text-white my-0">
                <span class="inline font-bold bg-gold-gradient">Let's Start Your Communication Journey</span>
            </h1>
            <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto mt-4">
                Get personalized coaching recommendations and a free 15-minute consultation to transform your executive presence.
            </p>
            
            <!-- Trust badges -->
            <div class="flex flex-wrap items-center justify-center gap-6 mt-8">
                <div class="flex items-center bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow">
                    <svg class="w-5 h-5 mr-2 text-brand-gold-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">24-hour response</span>
                </div>
                <div class="flex items-center bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow">
                    <svg class="w-5 h-5 mr-2 text-brand-gold-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">100% confidential</span>
                </div>
                <div class="flex items-center bg-white dark:bg-gray-800 px-4 py-2 rounded-full shadow">
                    <svg class="w-5 h-5 mr-2 text-brand-gold-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">No obligation</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Contact Form using Partial -->
    <div class="max-w-screen-xl mx-auto px-4 py-8">
        {{ partial "contact-form.html" . }}
    </div>
</section>
{{ end }}
