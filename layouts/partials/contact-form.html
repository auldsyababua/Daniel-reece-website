<!-- Contact Form Partial -->
<div x-data="contactForm()" x-init="init()" class="max-w-3xl mx-auto">
  <!-- Success Message -->
  <div x-show="showSuccess" x-transition class="mb-8 p-6 bg-gradient-to-r from-green-50 to-emerald-50 dark:from-green-900/20 dark:to-emerald-900/20 border border-green-200 dark:border-green-800 rounded-lg">
    <div class="flex items-start">
      <svg class="w-6 h-6 text-green-600 dark:text-green-400 mr-3 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
        <REDACTED_AIRTABLE_PAT fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
      </svg>
      <div>
        <h3 class="text-lg font-semibold text-green-900 dark:text-green-100">Message Sent Successfully!</h3>
        <p class="text-green-700 dark:text-green-300 mt-1">Thank you for reaching out. We'll respond within 24 hours.</p>
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div x-show="showError" x-transition class="mb-8 p-6 bg-gradient-to-r from-red-50 to-rose-50 dark:from-red-900/20 dark:to-rose-900/20 border border-red-200 dark:border-red-800 rounded-lg">
    <div class="flex items-start">
      <svg class="w-6 h-6 text-red-600 dark:text-red-400 mr-3 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
        <REDACTED_AIRTABLE_PAT fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      <div>
        <h3 class="text-lg font-semibold text-red-900 dark:text-red-100">Oops! Something went wrong</h3>
        <p class="text-red-700 dark:text-red-300 mt-1" x-text="errorMessage"></p>
      </div>
    </div>
  </div>

  <form 
    action="{{ .Site.Params.contact.formsubmit_endpoint | default "https://formsubmit.co/your@email.com" }}"
    method="POST"
    @submit="handleSubmit($event)"
    class="space-y-8"
  >
    <!-- Hidden Fields -->
    <input type="hidden" name="_subject" value="New contact from Executive Speech Coaching NYC">
    <input type="hidden" name="_next" value="{{ .Site.BaseURL }}{{ .Site.Params.contact.thank_you_page | default "/contact/thank-you/" }}">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" style="display:none">
    
    <!-- Contact Information Section -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 md:p-8">
      <h2 class="text-2xl font-bold text-brand-navy-900 dark:text-white mb-6 flex items-center">
        <svg class="w-6 h-6 mr-2 text-brand-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <REDACTED_AIRTABLE_PAT stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        Contact Information
      </h2>
      
      <div class="grid md:grid-cols-2 gap-6">
        <!-- Name Field -->
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Full Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            x-model="formData.name"
            @blur="validateField('name')"
            :class="{'border-red-500 focus:ring-red-500': errors.name, 'border-brand-gold-400 focus:ring-brand-gold-500': touched.name && !errors.name}"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold-500 focus:border-transparent transition-all duration-200"
            required
          >
          <p x-show="errors.name" x-text="errors.name" class="mt-1 text-sm text-red-600 dark:text-red-400"></p>
        </div>

        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Email Address <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            x-model="formData.email"
            @blur="validateField('email')"
            :class="{'border-red-500 focus:ring-red-500': errors.email, 'border-brand-gold-400 focus:ring-brand-gold-500': touched.email && !errors.email}"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold-500 focus:border-transparent transition-all duration-200"
            required
          >
          <p x-show="errors.email" x-text="errors.email" class="mt-1 text-sm text-red-600 dark:text-red-400"></p>
        </div>

        <!-- Phone Field -->
        <div>
          <label for="phone" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Phone Number
          </label>
          <input
            type="tel"
            id="phone"
            name="phone"
            x-model="formData.phone"
            @blur="validateField('phone')"
            placeholder="(555) 123-4567"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold-500 focus:border-transparent transition-all duration-200"
          >
        </div>

        <!-- Company Field -->
        <div>
          <label for="company" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Company/Organization
          </label>
          <input
            type="text"
            id="company"
            name="company"
            x-model="formData.company"
            placeholder="Your company name"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold-500 focus:border-transparent transition-all duration-200"
          >
        </div>
      </div>
    </div>

    <!-- Service Selection Section -->
    <div class="bg-brand-gold-50 dark:bg-brand-gold-900/10 rounded-xl shadow-lg p-6 md:p-8">
      <h2 class="text-2xl font-bold text-brand-navy-900 dark:text-white mb-6 flex items-center">
        <svg class="w-6 h-6 mr-2 text-brand-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <REDACTED_AIRTABLE_PAT stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        I'm Interested In
      </h2>
      
      <select
        id="service"
        name="service"
        x-model="formData.service"
        @change="validateField('service')"
        :class="{'border-red-500 focus:ring-red-500': errors.service}"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold-500 focus:border-transparent transition-all duration-200"
        required
      >
        <option value="">Select a service...</option>
        <option value="discovery-call">🎯 Discovery Call - Free Consultation</option>
        <option value="1-1-coaching">💼 1:1 Executive Speech Coaching</option>
        <option value="executive-training">🚀 Executive Training Programs</option>
        <option value="group-training">👥 Group Communication Training</option>
        <option value="presentation-skills">🎤 Presentation Skills Workshop</option>
        <option value="other">💬 Other (please specify in message)</option>
      </select>
      <p x-show="errors.service" x-text="errors.service" class="mt-1 text-sm text-red-600 dark:text-red-400"></p>
    </div>

    <!-- Message Section -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 md:p-8">
      <h2 class="text-2xl font-bold text-brand-navy-900 dark:text-white mb-6 flex items-center">
        <svg class="w-6 h-6 mr-2 text-brand-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <REDACTED_AIRTABLE_PAT stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        Tell Us About Your Goals
      </h2>
      
      <div>
        <label for="message" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
          How can we help you? <span class="text-red-500">*</span>
        </label>
        <textarea
          id="message"
          name="message"
          x-model="formData.message"
          @blur="validateField('message')"
          @input="updateCharCount()"
          :class="{'border-red-500 focus:ring-red-500': errors.message}"
          rows="6"
          placeholder="Please share what you're looking to achieve with executive speech coaching..."
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-gold-500 focus:border-transparent transition-all duration-200"
          required
        ></textarea>
        <div class="flex justify-between items-center mt-2">
          <p x-show="errors.message" x-text="errors.message" class="text-sm text-red-600 dark:text-red-400"></p>
          <span class="text-sm text-gray-500" x-text="`${charCount}/1000`"></span>
        </div>
      </div>
    </div>

    <!-- Trust Signals -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-center">
      <div class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-lg shadow">
        <svg class="w-8 h-8 text-green-500 mb-2" fill="currentColor" viewBox="0 0 20 20">
          <REDACTED_AIRTABLE_PAT fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">SSL Secure</span>
      </div>
      
      <div class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-lg shadow">
        <svg class="w-8 h-8 text-blue-500 mb-2" fill="currentColor" viewBox="0 0 20 20">
          <REDACTED_AIRTABLE_PAT fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
        </svg>
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">100% Confidential</span>
      </div>
      
      <div class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-lg shadow">
        <svg class="w-8 h-8 text-purple-500 mb-2" fill="currentColor" viewBox="0 0 20 20">
          <REDACTED_AIRTABLE_PAT d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
          <REDACTED_AIRTABLE_PAT d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
        </svg>
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">No Spam</span>
      </div>
      
      <div class="flex flex-col items-center p-3 bg-white dark:bg-gray-800 rounded-lg shadow">
        <svg class="w-8 h-8 text-brand-gold-500 mb-2" fill="currentColor" viewBox="0 0 20 20">
          <REDACTED_AIRTABLE_PAT fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
        </svg>
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">24hr Response</span>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button
        type="submit"
        :disabled="isSubmitting"
        :class="{'opacity-50 cursor-not-allowed': isSubmitting}"
        class="inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-white bg-gradient-to-r from-brand-gold-500 to-brand-gold-600 hover:from-brand-gold-600 hover:to-brand-gold-700 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-brand-gold-500 focus:ring-opacity-50"
      >
        <span x-show="!isSubmitting">Send My Message</span>
        <span x-show="isSubmitting" class="flex items-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <REDACTED_AIRTABLE_PAT class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></REDACTED_AIRTABLE_PAT>
          </svg>
          Sending...
        </span>
      </button>
    </div>
  </form>
</div>

<script src="{{ "js/contact-form.js" | relURL }}"></script>
